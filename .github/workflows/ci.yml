# Continuous Integration for BudgetBasket (fork ops).
# Canon: project COMMANDS.md / scripts/test-all.ps1 + GitHub Actions CI practices.
# Runs on every push to main (including daily sync-upstream). Does NOT deploy.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: pytest
        run: python -m pytest -q

  file-guard:
    name: file_guard pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libmagic (python-magic)
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: file_guard/requirements.txt

      - name: Install file_guard deps
        run: |
          python -m pip install --upgrade pip
          pip install -r file_guard/requirements.txt
          pip install pytest

      - name: pytest file_guard
        env:
          FILE_GUARD_ANTIVIRUS_ENABLED: "false"
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest file_guard/tests -q

  frontend:
    name: Frontend test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: vitest
        run: npm test

      - name: production build
        run: npm run build
