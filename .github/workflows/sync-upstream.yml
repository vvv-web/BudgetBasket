# Auto-sync upstream changes into a review PR for fork main.
# Does NOT deploy: Deploy test is workflow_dispatch-only (manual).
name: Sync fork from upstream

on:
  schedule:
    # Daily 05:00 UTC (BudgetBasket — активный МБО; чаще, чем «раз в 4 дня» у редких форков)
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: sync-upstream-budgetbasket
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create upstream sync PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote get-url upstream >/dev/null 2>&1 || \
            git remote add upstream https://github.com/alexonderia/BudgetBasket.git
          git fetch origin main
          git fetch upstream main

          SYNC_BRANCH="automation/upstream-sync"
          git fetch origin \
            "refs/heads/${SYNC_BRANCH}:refs/remotes/origin/${SYNC_BRANCH}" || true
          git switch -C "${SYNC_BRANCH}" origin/main

          if ! git merge --no-edit --no-ff upstream/main \
            -m "chore: merge upstream alexonderia/BudgetBasket"; then
            git merge --abort || true
            echo "::error::Upstream merge conflict. Resolve in a dedicated PR; main was not changed."
            exit 1
          fi

          if git diff --quiet origin/main...HEAD; then
            echo "SYNC_NO_CHANGES"
            exit 0
          fi

          git push --force-with-lease origin \
            "HEAD:refs/heads/${SYNC_BRANCH}"
          PR_NUMBER="$(
            gh pr list \
              --repo "${GITHUB_REPOSITORY}" \
              --head "${SYNC_BRANCH}" \
              --base main \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"
          if [[ -z "${PR_NUMBER}" ]]; then
            gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base main \
              --head "${SYNC_BRANCH}" \
              --title "chore: sync upstream BudgetBasket" \
              --body "Review upstream changes. CI must pass before merging into main."
          else
            gh pr edit "${PR_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "chore: sync upstream BudgetBasket" \
              --body "Review upstream changes. CI must pass before merging into main."
          fi

          # GITHUB_TOKEN-created PRs do not reliably start pull_request workflows.
          # workflow_dispatch is explicit and allowed, so CI still runs on sync SHA.
          gh workflow run ci.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${SYNC_BRANCH}"
