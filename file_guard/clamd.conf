LocalSocket /run/clamav/clamd.sock
FixStaleSocket yes
LocalSocketMode 666
User clamav
Foreground yes
LogTime yes
LogFile /var/log/clamav/clamd.log
PidFile /run/clamav/clamd.pid
DatabaseDirectory /var/lib/clamav
# Тестовый контур на VPS: контейнер живёт у лимита памяти, поэтому:
# - не держим вторую копию движка при обновлении БД (пик x2 = OOM при лимите 1Gi)
ConcurrentDatabaseReload no
# - меньше параллельных сканов = меньше пиковая память (нагрузка ~40 пользователей max)
MaxThreads 4
MaxQueue 8
