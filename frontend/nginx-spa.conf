# SPA-раздача статики внутри контейнера bb-frontend (React Router: любой путь -> index.html).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Хэшированные ассеты Vite (js/css/шрифты/картинки) — можно кэшировать.
    location ~* \.(?:js|css|woff2?|ttf|png|jpe?g|gif|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
