# BudgetBasket TEST — budgetbasket.acom-offer-desk.ru
# API under /api (strip prefix → FastAPI bb-backend в k3s через ClusterIP :8000); SPA → bb-frontend в k3s.
# (Фаза 3 MBO №2: SPA больше не Vite :5173, а production-статика в k3s; паттерн B — ClusterIP + хостовый nginx.)
#
# Install on VPS:
#   sudo cp deploy/nginx/budgetbasket.acom-offer-desk.ru.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/budgetbasket.acom-offer-desk.ru /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Backend+frontend теперь в k3s (Фаза 4 MBO №2); docker-бэкенд 127.0.0.1:18000 остановлен 14.09.2026.

upstream bb_frontend { server 10.43.0.150:80; }
upstream bb_backend  { server 10.43.89.0:8000; }   # F6 (15.09.2026): k3s bb-backend ClusterIP (было docker 127.0.0.1:18000)

server {
    server_name budgetbasket.acom-offer-desk.ru;
    client_max_body_size 30m;

    # API + WebSocket (browser calls /api/...; backend sees /...)
    location /api/ {
        proxy_pass http://bb_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }

    # SPA (React Router: /requests/:id, /login, etc.)
    location / {
        proxy_pass http://bb_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/budgetbasket.acom-offer-desk.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/budgetbasket.acom-offer-desk.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = budgetbasket.acom-offer-desk.ru) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name budgetbasket.acom-offer-desk.ru;
    return 404;
}
