# BudgetBasket TEST — budgetbasket.acom-offer-desk.ru
# API under /api (strip prefix → FastAPI on :18000); SPA routes (e.g. /requests/:id) → Vite :5173.
#
# Install on VPS:
#   sudo cp deploy/nginx/budgetbasket.acom-offer-desk.ru.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/budgetbasket.acom-offer-desk.ru /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Requires VITE_API_URL=/api in BudgetBasket .env and frontend container recreate.

upstream bb_frontend { server 127.0.0.1:5173; }
upstream bb_backend  { server 127.0.0.1:18000; }

server {
    server_name budgetbasket.acom-offer-desk.ru;
    client_max_body_size 30m;

    # API + WebSocket (browser calls /api/...; backend sees /...)
    location /api/ {
        proxy_pass http://bb_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }

    # SPA (React Router: /requests/:id, /login, etc.)
    location / {
        proxy_pass http://bb_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/budgetbasket.acom-offer-desk.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/budgetbasket.acom-offer-desk.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = budgetbasket.acom-offer-desk.ru) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name budgetbasket.acom-offer-desk.ru;
    return 404;
}
